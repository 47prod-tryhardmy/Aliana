services:
  - type: worker
    name: fantasy-novel-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
    disk:
      name: novel-data
      mountPath: /var/data
      sizeGB: 1
